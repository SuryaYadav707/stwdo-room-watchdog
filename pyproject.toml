[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stwdo-room-watchdog"
version = "0.1.0"
description = "Watchdog + auto-apply agent for Studierendenwerk Dortmund student rooms"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # REQUIRED ON WINDOWS: zoneinfo reads the OS timezone database, which Windows
    # does not ship. Without this, ZoneInfo("Europe/Berlin") raises and the
    # watchdog cannot compute the 10:00 Berlin publication window at all.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = ["langchain>=0.2", "langchain-anthropic>=0.1"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
stwdo = "stwdo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
